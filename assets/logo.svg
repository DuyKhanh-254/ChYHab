<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68" fill="none">
  <defs>
    <linearGradient id="chyOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5100" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF5100" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Text: ChYHab -->
  <text x="8" y="52" font-family="'Nunito', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#chyOrange)" letter-spacing="-0.5" filter="url(#softShadow)">
    ChY<tspan fill="#FF5E00">Hab</tspan>
  </text>

  <!-- Green Sprout Leaf resting playfully on top of the 'b' -->
  <g transform="translate(195, 2) scale(0.85)">
    <!-- Stem -->
    <path d="M 12 36 C 14 26 22 18 34 16" stroke="#4ADE80" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Left Leaf -->
    <path d="M 15 28 C 8 20 10 8 24 10 C 26 20 22 26 15 28 Z" fill="url(#leafGrad)"/>
    <path d="M 16 26 C 13 18 17 12 22 12" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- Right Leaf -->
    <path d="M 30 18 C 38 12 48 16 46 28 C 36 30 30 24 30 18 Z" fill="url(#leafGrad)"/>
    <!-- Highlight dot -->
    <circle cx="20" cy="14" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
